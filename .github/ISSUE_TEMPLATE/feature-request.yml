name: Feature request
description: Suggest a change to the game. Triage builds small improvements at once and puts new features to a player vote in the Telegram channel.
labels: [feature-request]
body:
  - type: textarea
    id: idea
    attributes:
      label: What should change?
      description: Describe one change. Say what the player sees or does after it.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why?
      description: What problem does it solve, or what does it make more fun?
    validations:
      required: true
