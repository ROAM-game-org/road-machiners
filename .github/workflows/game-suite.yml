name: game suite
run-name: game suite ${{ inputs.sha }}

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Commit to test
        required: true
        type: string

permissions:
  contents: read

jobs:
  suite:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    container: mcr.microsoft.com/playwright:v1.63.0-noble
    env:
      SHA: ${{ inputs.sha }}
      TEST_STALL_MINUTES: '10'
      TEST_SUITE_MINUTES: '35'
      TEST_TIMEOUTS: 'off'
    steps:
      - name: install git
        run: apt-get update && apt-get install -y --no-install-recommends git
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: checkout the commit
        run: |
          echo "$SHA" | grep -Eq '^[0-9a-f]{7,40}$'
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git checkout --quiet --detach "$SHA"
          git log -1 --format='%H %s'
      - name: npm ci
        working-directory: game
        run: npm ci
      - name: tests
        id: tests
        working-directory: game
        run: |
          code=0
          npm run test:cached || code=$?
          if [ "$code" -eq 3 ]; then
            echo "over=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          exit "$code"
      - name: suite time limit
        if: steps.tests.outputs.over == '1'
        run: |
          echo "The suite ran past TEST_SUITE_MINUTES with no failed test."
          exit 1
