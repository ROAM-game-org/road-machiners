name: perf ci
run-name: perf ci ${{ github.sha }}

on:
  push:
    branches: ['perf-ci/**']

permissions:
  contents: read

jobs:
  turns:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: npm ci
        working-directory: game
        run: npm ci
      - name: drive turns
        working-directory: game
        run: npx vite-node scripts/turn-profile.mjs drive 8 | tee ../drive-turns.log
      - name: fight turns
        working-directory: game
        run: npx vite-node scripts/turn-profile.mjs fight 8 | tee ../fight-turns.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: turn-profiles
          path: '*-turns.log'

  draws:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    container: mcr.microsoft.com/playwright:v1.63.0-noble
    steps:
      - uses: actions/checkout@v4
      - name: npm ci
        working-directory: game
        run: npm ci
      - name: perf report on the far town scenes
        working-directory: game
        continue-on-error: true
        run: npm run perf -- --scenes town-day-far,town-night-far
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: perf-reports
          path: game/perf-reports
