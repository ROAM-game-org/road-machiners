# Hermes for the factory chat bot. It runs the same on the Mac and on the server.
# Paths come from env. FACTORY_HOME is the factory home. FACTORY_HERMES_DIR holds Hermes state and defaults to $FACTORY_HOME/hermes.
# Run: docker compose -f factory/hermes/compose.yaml --env-file factory/settings.env --env-file factory/.env up -d
name: factory-hermes

services:
  hermes:
    container_name: factory-hermes
    image: factory-hermes:local
    build:
      context: .
      dockerfile: Dockerfile
    command: ["/usr/local/bin/factory-start"]
    restart: unless-stopped
    # A kill during shutdown leaves Hermes's Telegram long poll open. Telegram then answers the restart with a conflict and Hermes drops the queued updates.
    stop_grace_period: 60s
    environment:
      # The image's s6 supervisor kills the main command 3 s after the stop signal by default. This stays under Docker's 60 s grace.
      S6_KILL_GRACETIME: "50000"
      HERMES_HOME: /opt/data
      # Hermes runs as the factory user, so the files it edits keep their owner.
      HERMES_UID: ${FACTORY_UID:?set FACTORY_UID}
      HERMES_GID: ${FACTORY_UID:?set FACTORY_UID}
      FACTORY_REPO: ${FACTORY_REPO:?set FACTORY_REPO}
      FACTORY_PUBLIC_URL: ${FACTORY_PUBLIC_URL:?set FACTORY_PUBLIC_URL}
      FACTORY_STATUS_TIMEOUT_MS: ${FACTORY_STATUS_TIMEOUT_MS:?set FACTORY_STATUS_TIMEOUT_MS}
      FACTORY_ROUTE_MIN_WORDS: ${FACTORY_ROUTE_MIN_WORDS:?set FACTORY_ROUTE_MIN_WORDS}
      GH_CONFIG_DIR: /opt/data/.config/gh
      # Hermes's file tools write its own home and the factory home, where it fixes state and branches.
      HERMES_WRITE_SAFE_ROOT: /opt/data:/factory/home
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?set TELEGRAM_BOT_TOKEN}
      FACTORY_COMMITTEE_DIR: /factory/home/committee
      FACTORY_COMMITTEE_BOOTSTRAP: ${FACTORY_COMMITTEE_BOOTSTRAP:?set FACTORY_COMMITTEE_BOOTSTRAP}
      FACTORY_COMMITTEE_BOOTSTRAP_GITHUB: ${FACTORY_COMMITTEE_BOOTSTRAP_GITHUB:?set FACTORY_COMMITTEE_BOOTSTRAP_GITHUB}
      FACTORY_COMMITTEE_CHAT: ${FACTORY_COMMITTEE_CHAT:?set FACTORY_COMMITTEE_CHAT}
      # The committee chat is Hermes's home channel, so it does not ask for one.
      TELEGRAM_HOME_CHANNEL: ${FACTORY_COMMITTEE_CHAT:?set FACTORY_COMMITTEE_CHAT}
      FACTORY_INBOX: /factory/home/inbox
      FACTORY_PUBLIC_INBOX: /factory/home/public-inbox
      FACTORY_PUBLIC_DISCUSSION: ${FACTORY_PUBLIC_DISCUSSION:?set FACTORY_PUBLIC_DISCUSSION}
      FACTORY_PROPOSAL_CHAT: ${FACTORY_PROPOSAL_CHAT:?set FACTORY_PROPOSAL_CHAT}
      FACTORY_STATE_DIR: /factory/home/state
      FACTORY_OBSERVATION_HEARTBEAT_MS: ${FACTORY_OBSERVATION_HEARTBEAT_MS:?set FACTORY_OBSERVATION_HEARTBEAT_MS}
    volumes:
      - ${FACTORY_HERMES_DIR:-${FACTORY_HOME:?set FACTORY_HOME}/hermes}:/opt/data
      # Hermes manages the factory: it reads and edits the whole factory home and reads the factory code. SOUL.md names these paths.
      - ${FACTORY_HOME:?set FACTORY_HOME}:/factory/home
      # The server mounts /opt/factory at the same path, so the links code -> releases/current -> <sha> resolve inside the container.
      - ${FACTORY_CODE_SOURCE:-../..}:${FACTORY_CODE_TARGET:-/factory/code}:ro
    # factory-host reaches the server's sshd through this name.
    extra_hosts:
      - host.docker.internal:host-gateway
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - NET_RAW
      - NET_ADMIN
    cpus: 2
    # Hermes idles near 300 MB. The cap leaves room for the testing gate.
    mem_limit: 2g
    pids_limit: 256
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import subprocess; assert subprocess.run(['/opt/hermes/bin/hermes', 'gateway', 'status'], stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL).returncode == 0"
      interval: 30s
      # `hermes gateway status` takes several seconds inside the s6 image.
      timeout: 30s
      retries: 3
      start_period: 30s
