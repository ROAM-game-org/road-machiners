<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Road Machiners</title>
    <link rel="icon" href="/logo/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" type="image/png" href="/logo/favicon-32.png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/logo/logo-tiny.png" />
    <link rel="stylesheet" href="/src/ui/style.css" />
  </head>
  <body>
    <div id="boot" aria-busy="true">
      <div class="boot-box">
        <h1 class="boot-title">Road Machiners</h1>
        <div class="boot-bar" role="progressbar" aria-label="Loading"><span class="boot-seg running"></span></div>
        <p class="boot-stage" aria-live="polite">Loading the game</p>
        <ul class="boot-steps"></ul>
      </div>
    </div>
    <script>
      (function () {
        var texts = {
          en: {
            failedToLoad: 'The game failed to load. Check your connection and reload the page.',
            failedToStart: 'The game could not start in this browser. Update the browser or try another one.',
          },
          ru: {
            failedToLoad: 'Игра не загрузилась. Проверьте подключение и перезагрузите страницу.',
            failedToStart: 'Игра не загрузилась. Откройте игру в другом браузере.',
          },
        };
        function language() {
          try {
            return localStorage.getItem('roam.lang') === 'ru' ? 'ru' : 'en';
          } catch (e) {
            return 'en';
          }
        }
        function show(key, detail) {
          var boot = document.getElementById('boot');
          if (!boot || boot.dataset.adopted) return false;
          var text = texts[language()][key];
          boot.dataset.fonts = 'ready';
          boot.classList.add('failed');
          boot.setAttribute('aria-busy', 'false');
          boot.querySelector('.boot-stage').textContent = text;
          boot.querySelector('[role=progressbar]').setAttribute('aria-valuetext', text);
          if (detail) {
            var item = document.createElement('li');
            item.textContent = detail;
            boot.querySelector('.boot-steps').appendChild(item);
          }
          return true;
        }
        function failed(e) {
          if (!document.getElementById('boot') || document.getElementById('boot').dataset.adopted) return window.removeEventListener('error', failed, true);
          if (e.target instanceof HTMLScriptElement) return show('failedToLoad');
          if (e instanceof ErrorEvent) show('failedToStart', e.message);
        }
        window.addEventListener('error', failed, true);
        window.bootNoModules = function () {
          show('failedToStart');
        };
        var shell = document.getElementById('boot');
        function revealFonts() {
          shell.dataset.fonts = 'ready';
        }
        var mono = ["400 14px 'IBM Plex Mono'", "700 14px 'IBM Plex Mono'"];
        var english = ["400 14px 'Barlow Semi Condensed'", "700 14px 'Barlow Semi Condensed'"].concat(mono);
        var russian = ["400 14px 'Fira Sans Condensed'", "700 14px 'Fira Sans Condensed'"].concat(mono);
        var stored = null;
        try { stored = localStorage.getItem('roam.lang'); } catch (e) {}
        var faces = stored === 'ru' ? russian : english;
        var sample = stored === 'ru' ? 'Дорожные машинисты 0123456789' : 'Road Machiners 0123456789';
        if (!document.fonts || !document.fonts.load) return revealFonts();
        setTimeout(revealFonts, 2500);
        Promise.all(faces.map(function (face) { return document.fonts.load(face, sample); })).then(revealFonts, revealFonts);
      })();
    </script>
    <script nomodule>
      window.bootNoModules();
    </script>
    <div id="game"></div>
    <div id="overlay"></div>
    <div id="ui"></div>
    <script type="module" src="/src/three/main.ts"></script>
  </body>
</html>
