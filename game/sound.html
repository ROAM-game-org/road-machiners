<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Road Machiners sound board</title>
    <style>
      body { background: #1a1410; color: #f0e0b8; font: 13px/1.5 ui-monospace, Menlo, monospace; margin: 0 16px 16px; }
      h2 { color: #d8b878; font-weight: normal; margin: 20px 0 4px; }
      [hidden] { display: none !important; }
      .toolbar { position: sticky; top: 0; z-index: 1; display: flex; gap: 8px; align-items: center; padding: 10px 0; background: #1a1410; border-bottom: 1px solid #6a4a30; }
      .toolbar input { flex: 1; max-width: 420px; font: inherit; background: #2a1e16; color: #f0e0b8; border: 1px solid #6a4a30; padding: 3px 8px; }
      .cue { display: flex; gap: 6px; align-items: center; padding: 2px 0; }
      .cue b, .cue .state { width: 230px; font-weight: normal; color: #f0e0b8; }
      .cue b { font-weight: bold; }
      .kind, .count { color: #b8a888; font-size: 11px; min-width: 90px; }
      .missing { color: #e07050; }
      button { font: inherit; background: #3a2a1e; color: #f0e0b8; border: 1px solid #6a4a30; padding: 1px 8px; cursor: pointer; }
      button.take { min-width: 28px; }
      button.bus:not(.on) { opacity: 0.4; }
    </style>
  </head>
  <body>
    <div id="board"></div>
    <script type="module" src="/src/audio/board.ts"></script>
  </body>
</html>
